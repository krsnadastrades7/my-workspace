<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="theme-color" content="#050811">
		<title>SYSTEM | A sharper way to plan</title>
	<style>
		:root {
				color-scheme: dark;
				--bg: #050811;
				--surface: rgba(10, 25, 47, .9);
				--surface-strong: #0a192f;
				--ink: #ffffff;
				--muted: #9eabc0;
				--line: #14345d;
				--accent: #d7263d;
				--accent-strong: #e63946;
				--accent-soft: #401525;
				--danger: #e63946;
				--shadow: 0 24px 70px rgba(0, 0, 0, .4);
		}

		[data-theme="dark"] {
			color-scheme: dark;
				--bg: #050811;
				--surface: rgba(0, 31, 84, .88);
				--surface-strong: #001f54;
				--ink: #ffffff;
				--muted: #a8b7cf;
				--line: #123c78;
				--accent: #e63946;
				--accent-strong: #d7263d;
				--accent-soft: #481526;
				--danger: #e63946;
				--shadow: 0 24px 70px rgba(0, 0, 0, .46);
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			color: var(--ink);
			background: var(--bg);
			font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
			transition: background .3s ease, color .3s ease;
		}
		body::before {
			content: "";
			position: fixed;
			inset: 0;
			z-index: -1;
			pointer-events: none;
			background: radial-gradient(circle at 12% 8%, rgba(0, 31, 84, .5), transparent 30%), radial-gradient(circle at 92% 90%, rgba(215, 38, 61, .12), transparent 25%);
		}
		button, input { font: inherit; }
		button { cursor: pointer; }
		.app-shell { width: min(100% - 40px, 980px); margin: 0 auto; padding: 36px 0 64px; }
		.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 64px; }
		.brand { display: flex; gap: 11px; align-items: center; font-weight: 800; letter-spacing: -.04em; font-size: 1.25rem; }
		.brand-mark { display: grid; width: 32px; height: 32px; place-items: center; color: #fff; background: var(--accent); border-radius: 10px; box-shadow: 0 7px 15px rgba(215, 38, 61, .3); }
		.theme-toggle { display: flex; align-items: center; gap: 9px; padding: 9px 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 100px; font-size: .82rem; transition: border .2s, color .2s, transform .2s; }
		.theme-toggle:hover { color: var(--ink); border-color: var(--accent); transform: translateY(-1px); }
		.theme-icon { font-size: 1rem; }
		.intro { max-width: 680px; margin-bottom: 32px; animation: rise .65s ease both; }
		.eyebrow { margin: 0 0 12px; color: var(--accent); font-size: .75rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
		h1 { margin: 0; font-size: clamp(2.5rem, 7vw, 5.2rem); line-height: .95; letter-spacing: -.075em; }
		.intro-copy { max-width: 475px; margin: 20px 0 0; color: var(--muted); line-height: 1.65; font-size: 1.02rem; }
		.todo-card { padding: 25px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); backdrop-filter: blur(16px); animation: rise .65s .1s ease both; }
		.task-form { display: flex; gap: 10px; padding-bottom: 25px; border-bottom: 1px solid var(--line); }
		.task-input { min-width: 0; flex: 1; padding: 14px 16px; color: var(--ink); background: var(--surface-strong); border: 1px solid var(--line); border-radius: 12px; outline: 0; transition: border .2s, box-shadow .2s; }
		.task-input::placeholder { color: var(--muted); }
		.task-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
		.add-button { padding: 0 20px; color: #fff; background: var(--accent); border: 0; border-radius: 12px; font-weight: 800; transition: background .2s, transform .2s; }
		.add-button:hover { background: var(--accent-strong); transform: translateY(-1px); }
		.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 21px 0 17px; }
		.task-count { margin: 0; color: var(--muted); font-size: .88rem; }
		.task-count strong { color: var(--ink); }
		.filters { display: flex; gap: 4px; padding: 4px; background: var(--surface-strong); border: 1px solid var(--line); border-radius: 10px; }
		.filter-button { padding: 6px 11px; color: var(--muted); background: transparent; border: 0; border-radius: 7px; font-size: .78rem; font-weight: 700; }
		.filter-button.active { color: var(--ink); background: var(--accent-soft); }
		.task-list { display: grid; gap: 9px; min-height: 76px; }
		.task-item { display: flex; align-items: center; gap: 13px; padding: 15px 13px; background: var(--surface-strong); border: 1px solid var(--line); border-radius: 13px; animation: task-in .35s ease both; }
		.task-item.completed { opacity: .66; }
		.check-button { flex: 0 0 auto; width: 22px; height: 22px; padding: 0; color: transparent; background: transparent; border: 1.5px solid var(--muted); border-radius: 50%; transition: background .2s, border .2s, transform .2s; }
		.check-button:hover { border-color: var(--accent); transform: scale(1.08); }
		.completed .check-button { color: #fff; background: var(--accent); border-color: var(--accent); font-size: .74rem; }
		.task-text { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: .95rem; line-height: 1.4; }
		.completed .task-text { color: var(--muted); text-decoration: line-through; }
		.delete-button { padding: 5px; color: var(--muted); background: transparent; border: 0; font-size: 1.1rem; line-height: 1; opacity: .45; transition: color .2s, opacity .2s; }
		.task-item:hover .delete-button, .delete-button:focus { color: var(--danger); opacity: 1; }
		.empty-state { display: grid; place-items: center; padding: 25px 10px; color: var(--muted); text-align: center; }
		.empty-state p { margin: 0; font-size: .9rem; }
		.footer-note { margin: 22px 0 0; color: var(--muted); font-size: .76rem; text-align: center; }
		@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
		@keyframes task-in { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 620px) {
			.app-shell { width: min(100% - 28px, 980px); padding-top: 22px; }
			.topbar { margin-bottom: 49px; }
			.theme-toggle span:last-child { display: none; }
			.todo-card { padding: 17px; border-radius: 19px; }
			.task-form { flex-direction: column; }
			.add-button { min-height: 46px; }
			.toolbar { align-items: flex-start; flex-direction: column; }
			.filters { width: 100%; }
			.filter-button { flex: 1; }
		}
	</style>
</head>
<body>
	<main class="app-shell">
		<header class="topbar">
			<div class="brand"><span class="brand-mark" aria-hidden="true">✓</span><span>SYSTEM</span></div>
			<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode"><span class="theme-icon" aria-hidden="true">☾</span><span>Dark mode</span></button>
		</header>

		<section class="intro" aria-labelledby="page-title">
			<p class="eyebrow">A little clarity, daily</p>
			<h1 id="page-title">Make space for<br>what matters.</h1>
			<p class="intro-copy">A calm place for the small promises you make to yourself. Keep it simple, keep moving.</p>
		</section>

		<section class="todo-card" aria-label="To-do list">
			<form class="task-form" id="taskForm">
				<input class="task-input" id="taskInput" type="text" maxlength="120" placeholder="What needs your attention?" aria-label="New task" autocomplete="off">
				<button class="add-button" type="submit">Add task</button>
			</form>
			<div class="toolbar">
				<p class="task-count" id="taskCount" aria-live="polite"><strong>0 tasks</strong> to go</p>
				<nav class="filters" aria-label="Filter tasks">
					<button class="filter-button active" data-filter="all" type="button">All</button>
					<button class="filter-button" data-filter="active" type="button">Active</button>
					<button class="filter-button" data-filter="completed" type="button">Done</button>
				</nav>
			</div>
			<div class="task-list" id="taskList"></div>
			<p class="footer-note">Your list stays on this device.</p>
		</section>
	</main>

	<script>
		const storageKey = "system-tasks";
		const themeKey = "system-theme";
		const taskForm = document.querySelector("#taskForm");
		const taskInput = document.querySelector("#taskInput");
		const taskList = document.querySelector("#taskList");
		const taskCount = document.querySelector("#taskCount");
		const themeToggle = document.querySelector("#themeToggle");
		const savedTasks = localStorage.getItem(storageKey) || localStorage.getItem("daymark-tasks") || "[]";
		let tasks = JSON.parse(savedTasks);
		let currentFilter = "all";

		function saveTasks() { localStorage.setItem(storageKey, JSON.stringify(tasks)); }

		function render() {
			const visibleTasks = tasks.filter(task => currentFilter === "all" || (currentFilter === "completed" ? task.completed : !task.completed));
			const remaining = tasks.filter(task => !task.completed).length;
			taskCount.innerHTML = `<strong>${remaining} ${remaining === 1 ? "task" : "tasks"}</strong> to go`;
			taskList.innerHTML = "";
			if (!visibleTasks.length) {
				const emptyMessage = tasks.length ? "Nothing here right now." : "Your list is clear. Add something to begin.";
				taskList.innerHTML = `<div class="empty-state"><p>${emptyMessage}</p></div>`;
				return;
			}
			visibleTasks.forEach(task => {
				const item = document.createElement("article");
				item.className = `task-item${task.completed ? " completed" : ""}`;
				item.dataset.id = task.id;
				item.innerHTML = `<button class="check-button" type="button" aria-label="${task.completed ? "Mark task active" : "Mark task complete"}">${task.completed ? "✓" : ""}</button><span class="task-text"></span><button class="delete-button" type="button" aria-label="Delete task">×</button>`;
				item.querySelector(".task-text").textContent = task.text;
				taskList.appendChild(item);
			});
		}

		taskForm.addEventListener("submit", event => {
			event.preventDefault();
			const text = taskInput.value.trim();
			if (!text) { taskInput.focus(); return; }
			tasks.unshift({ id: Date.now().toString(), text, completed: false });
			saveTasks();
			taskInput.value = "";
			currentFilter = "all";
			document.querySelectorAll(".filter-button").forEach(button => button.classList.toggle("active", button.dataset.filter === currentFilter));
			render();
			taskInput.focus();
		});

		taskList.addEventListener("click", event => {
			const item = event.target.closest(".task-item");
			if (!item) return;
			const task = tasks.find(entry => entry.id === item.dataset.id);
			if (event.target.closest(".check-button")) task.completed = !task.completed;
			if (event.target.closest(".delete-button")) tasks = tasks.filter(entry => entry.id !== item.dataset.id);
			saveTasks();
			render();
		});

		document.querySelectorAll(".filter-button").forEach(button => button.addEventListener("click", () => {
			currentFilter = button.dataset.filter;
			document.querySelectorAll(".filter-button").forEach(filter => filter.classList.toggle("active", filter === button));
			render();
		}));

		function setTheme(theme) {
			document.documentElement.dataset.theme = theme;
			localStorage.setItem(themeKey, theme);
			const dark = theme === "dark";
			themeToggle.querySelector(".theme-icon").textContent = dark ? "☀" : "☾";
			themeToggle.querySelector("span:last-child").textContent = dark ? "Light mode" : "Dark mode";
			themeToggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
		}
		themeToggle.addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
		setTheme(localStorage.getItem(themeKey) || "light");
		render();
	</script>
</body>
</html>
